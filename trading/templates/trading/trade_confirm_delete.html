{% extends "base.html" %}
{% block title %}Delete Trade | TradeIntel{% endblock %}
{% block content %}
<h1 class="h5">Delete Trade #{{ trade.id }}?</h1>
<form method="post" class="mt-3">
  {% csrf_token %}
  <button class="btn btn-danger">Yes, delete</button>
  <a class="btn btn-outline-secondary" href="{% url 'trading:trade_detail' trade.pk %}">Cancel</a>
</form>
{% endblock %}
